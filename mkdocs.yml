site_name: Project Data Dictionary
theme:
  name: material
  language: en
  features:
    - navigation.tabs # Crea tab in alto per le sezioni principali
    - navigation.sections # Raggruppa le voci nel menu laterale
    - search.suggest # Suggerimenti durante la ricerca
    - content.code.copy # Permette di copiare query di esempio

plugins:
  - search
  - i18n:
      docs_structure: suffix # Indica che userai file come nome.en.md
      languages:
        - locale: it
          name: Italiano
          build: true
        - locale: en
          default: true
          name: English
          build: true

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Overview of the schema (ER): schema_er.md
  - Data Dictionary:
    - Users and access control:
      - User groups: tables/users.md
      - Roles: tables/roles.md
    - Entities and relationships:
      - Enterprise and subclasses:
        - Enterprise: tables/enterprise.md
        - Building: tables/building.md
        - Farm: tables/farm.md
        - Network Systems: tables/network_system.md
      - Components and subclasses:
        - Component: tables/component.md
        - Added block: tables/added_block.md
        - Artistic good: tables/artistic_good.md
        - Building functionality: tables/building_functionality.md
        - Building component: tables/building_component.md
        - Electrical component: tables/electrical_network_component.md
        - Livestock: tables/livestock.md
        - Network service: tables/network_service.md
        - Provision: tables/provision.md
        - Staff: tables/staff.md
        - Transport network component: tables/transport_network_component.md
        - Telecommunication network component: tables/tlc_network_component.md
        - Fixed asset: tables/fixed_asset.md
      - Survey: tables/survey.md
      - Event: tables/event.md
      - Damage and subclasses: 
        - Damage: tables/damage.md
        - Whole structure damage: tables/damage_whole_structure.md
        - Vehicle damage: tables/damage_vehicles.md
        - Damages to people: tables/damage_people.md
  - Contribution Guidelines: guidelines.md

